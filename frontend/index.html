<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UFMDb — Ultimate Film Database</title>
    <meta
      name="description"
      content="UFMDb (Ultimate Film Database), film keşfetmek, puanlamak, izleme listesi oluşturmak ve yorum yazmak için Türkçe bir film veritabanı sitesi."
    />
    <link rel="canonical" href="https://ufmdb.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UFMDb" />
    <meta property="og:title" content="UFMDb — Ultimate Film Database" />
    <meta
      property="og:description"
      content="Film keşfetmek, puanlamak, izleme listesi oluşturmak ve yorum yazmak için Türkçe bir film veritabanı sitesi."
    />
    <meta property="og:url" content="https://ufmdb.com/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UFMDb — Ultimate Film Database" />
    <meta
      name="twitter:description"
      content="Film keşfetmek, puanlamak, izleme listesi oluşturmak ve yorum yazmak için Türkçe bir film veritabanı sitesi."
    />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
